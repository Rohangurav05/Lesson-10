<!DOCTYPE html>
<html>

<head>
    <title>9f Problem</title>
    <style>
        .div {
            width: 200px;
            font-family: arial;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
            border: 3px;
            border-style: solid;
            border-color: blue;
            padding-right: 5px;
            padding-left: 5px;
            padding-bottom: 5px;
            padding-top: 5px;
        }
        .containor
        {
            width: 700px;
            
            border: 3px;
            border-style: solid;
            border-color: blue;

        }
        .image {
            width: 200px;
            height: 250px;
            display: block;
            object-fit: cover;
            margin-bottom: 0;
        }

        .name {
            font-family: Arial;
            font-size: 20px;
            margin-top: 3px;
            margin-bottom: 0;
            margin-left: 0;
            padding-left: 2px;
        }

        .friend {
            margin-top: 2px;
            color: grey;
            font-size: 15px;
            padding-left: 8px;
            margin-bottom: 0;
        }

        .add-friend {
            background-color: rgb(42, 124, 225);
            color: white;
            border: none;
            font-size: 15px;
            border-radius: 5px;
            padding-left: 12px;
            padding-right: 12px;
            padding-top: 5px;
            padding-bottom: 5px;
            margin-top: 8px;
            margin-left: 8px;
            margin-bottom: 5px;
        }
        .name-div
        {
            width: 194px;
            border: 3px;
            border-style: solid;
            border-color: red;
        }
        .friend-div
        {
            width: 194px;
            border: 3px;
            border-style: solid;
            border-color: red;
        }
        .button-div
        {
            width: 194px;
            border: 3px;
            border-style: solid;
            border-color: red;
        }
    </style>
</head>

<body>
    <div class="containor">
        <div class="div">
            <img class="image" src="throne.jpg" alt="">
            <div class="name-div"><p class="name">Atharv</p></div>
            <div class="friend-div"><p class="friend">2 mutual friends</p></div>
            <div class="button-div"><button class="add-friend">Add Friend</button></div>
            
        </div>
        <div class="div">
            <img class="image" src="hod.jpg" alt="">
            <div class="name-div"><p class="name">Akshay</p></div>
            <div class="friend-div"><p class="friend">3 mutual friends</p></div>
            <div class="button-div"><button class="add-friend">Add Friend</button></div>
        </div>
        <div class="div">
            <img class="image" src="sword.jpg" alt="">
            <div class="name-div"><p class="name">Satya</p></div>
            <div class="friend-div"><p class="friend">4 mutual friends</p></div>
            <div class="button-div"><button class="add-friend">Add Friend</button></div>
        </div>
    </div>

</body>

  </html>
